<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
  </marker>
</defs>
<style>
  text{font-family:Arial,sans-serif;fill:#172033}
  .title{font-size:22px;font-weight:700}
  .subtitle{font-size:13px;fill:#475569}
  .label{font-size:15px;font-weight:700}
  .small{font-size:12px;fill:#334155}
  .module{fill:#f8fafc;stroke:#2563eb;stroke-width:1.6}
  .external{fill:#fff7ed;stroke:#c2410c;stroke-width:1.6;stroke-dasharray:7 5}
  .boundary{fill:#f8fafc;stroke:#0f766e;stroke-width:2}
  .orchestration{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2}
  .arrow{stroke:#334155;stroke-width:1.4;fill:none;marker-end:url(#arrow)}
  .event{stroke-dasharray:6 4}
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="title" x="28" y="34">OfficeHours AI — modular monolith with bounded modules</text>
<text class="subtitle" x="28" y="56">One deployable backend and one database; module boundaries are enforced in code, not by network hops.</text>

<rect class="external" x="24" y="96" width="185" height="94" rx="10"/>
<text class="label" x="116" y="122" text-anchor="middle">Canvas LMS</text>
<text class="small" x="116" y="145" text-anchor="middle">External resource</text>
<text class="small" x="116" y="163" text-anchor="middle">LTI launch + course sync</text>

<rect class="boundary" x="242" y="78" width="610" height="472" rx="16"/>
<text class="label" x="262" y="106">OFFICEHOURS AI SYSTEM BOUNDARY</text>

<rect class="module" x="274" y="126" width="546" height="58" rx="9"/>
<text class="label" x="547" y="150" text-anchor="middle">React multi-role application</text>
<text class="small" x="547" y="169" text-anchor="middle">HTTPS/JSON requests; WebSocket notifications</text>

<rect class="module" x="274" y="214" width="164" height="76" rx="9"/>
<text class="label" x="356" y="238" text-anchor="middle">Identity + courses</text>
<text class="small" x="356" y="260" text-anchor="middle">authenticate; authorize</text>
<text class="small" x="356" y="277" text-anchor="middle">role per course</text>

<rect class="module" x="462" y="214" width="164" height="76" rx="9"/>
<text class="label" x="544" y="238" text-anchor="middle">Academic support</text>
<text class="small" x="544" y="260" text-anchor="middle">Ask Triage; Help Coach</text>
<text class="small" x="544" y="277" text-anchor="middle">Rooms; Quiet ask</text>

<rect class="module" x="650" y="214" width="170" height="76" rx="9"/>
<text class="label" x="735" y="238" text-anchor="middle">Knowledge</text>
<text class="small" x="735" y="260" text-anchor="middle">upload; chunk; approve</text>
<text class="small" x="735" y="277" text-anchor="middle">course-scoped retrieval</text>

<rect class="orchestration" x="334" y="324" width="426" height="112" rx="11"/>
<text class="label" x="547" y="350" text-anchor="middle">Study Agent orchestration layer</text>
<text class="small" x="547" y="374" text-anchor="middle">owns cutoff → guards → budgets → cache → breaker</text>
<text class="small" x="547" y="394" text-anchor="middle">retrieves approved chunks; invokes bounded answer check</text>
<text class="small" x="547" y="414" text-anchor="middle">returns answer, refusal, staff hand-off, or busy state</text>

<rect class="module" x="334" y="466" width="426" height="58" rx="9"/>
<text class="label" x="547" y="490" text-anchor="middle">SQLAlchemy persistence</text>
<text class="small" x="547" y="511" text-anchor="middle">one SQLite database by default; schema owned by modules</text>

<rect class="external" x="884" y="326" width="172" height="106" rx="10"/>
<text class="label" x="970" y="352" text-anchor="middle">Model provider</text>
<text class="small" x="970" y="375" text-anchor="middle">External resource</text>
<text class="small" x="970" y="393" text-anchor="middle">Gemini or Claude</text>
<text class="small" x="970" y="411" text-anchor="middle">HTTPS/JSON; guarded calls</text>

<path class="arrow" d="M209 143 H274"/>
<text class="small" x="241" y="132" text-anchor="middle">launch/sync</text>
<text class="small" x="241" y="176" text-anchor="middle">HTTPS</text>

<path class="arrow" d="M547 184 V214"/>
<text class="small" x="558" y="204">API dispatch</text>

<path class="arrow" d="M735 290 V324"/>
<text class="small" x="748" y="310">approved chunks</text>

<path class="arrow" d="M626 290 L600 324"/>
<text class="small" x="572" y="310">student ask</text>

<path class="arrow" d="M547 436 V466"/>
<text class="small" x="560" y="456">SQL read/write</text>

<path class="arrow" d="M760 380 H884"/>
<text class="small" x="822" y="366" text-anchor="middle">bounded verification</text>
<text class="small" x="822" y="397" text-anchor="middle">HTTPS/JSON</text>
</svg>
