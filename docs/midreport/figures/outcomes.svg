<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420">
<style>text{font-family:Georgia,serif;fill:#1c1917} .small{font-size:12px} .title{font-size:18px}</style>
<rect width="100%" height="100%" fill="#faf7f2"/>
<text class="title" x="24" y="32">Outcome states</text>
<text class="small" x="24" y="52">API strings from agent_policy.py and kb_agent_service.py. Page sentence from StudentAgentPage.jsx.</text>
<g stroke="#44403c" fill="#fff">
<rect x="40" y="90" width="240" height="70" rx="8"/>
<rect x="300" y="90" width="240" height="70" rx="8"/>
<rect x="560" y="90" width="240" height="70" rx="8"/>
<rect x="40" y="220" width="240" height="70" rx="8"/>
<rect x="300" y="220" width="240" height="70" rx="8"/>
<rect x="560" y="220" width="240" height="70" rx="8"/>
<rect x="220" y="330" width="240" height="70" rx="8"/>
</g>
<text x="52" y="118" font-size="15">passed</text>
<text class="small" x="52" y="140">Checked answer. Quote not shown.</text>
<text x="312" y="118" font-size="15">not_answerable</text>
<text class="small" x="312" y="140">Check miss. Model refused.</text>
<text x="572" y="118" font-size="15">failed closed</text>
<text class="small" x="572" y="140">Check miss. No retrieval fallback.</text>
<text x="52" y="248" font-size="15">below_cutoff</text>
<text class="small" x="52" y="270">Staff form. No model call.</text>
<text x="312" y="248" font-size="15">quota or busy</text>
<text class="small" x="312" y="270">Busy text. No retrieval fallback.</text>
<text x="572" y="248" font-size="15">guard or kill switch</text>
<text class="small" x="572" y="270">Retrieval draft. No model call.</text>
<text x="232" y="358" font-size="15">Study Agent page</text>
<text class="small" x="232" y="380">seek-help or matched_count 0 becomes one sentence.</text>
</svg>
