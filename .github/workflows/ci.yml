name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Product CI is the backend + the unified app only.
# Legacy kiosk / professor-dashboard / ta-dashboard shells are not the product
# and are not built here.

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

  officehours-app:
    name: Product app build and audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/officehours-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/officehours-app
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend/officehours-app
        run: npm audit --audit-level=moderate

      - name: Build product app
        working-directory: frontend/officehours-app
        run: npm run build
