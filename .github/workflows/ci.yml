name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

  student-kiosk:
    name: Student kiosk build and audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/student-kiosk/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/student-kiosk
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend/student-kiosk
        run: npm audit --audit-level=moderate

      - name: Build student kiosk
        working-directory: frontend/student-kiosk
        run: npm run build

  professor-dashboard:
    name: Professor dashboard build and audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/professor-dashboard/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/professor-dashboard
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend/professor-dashboard
        run: npm audit --audit-level=moderate

      - name: Build professor dashboard
        working-directory: frontend/professor-dashboard
        run: npm run build
